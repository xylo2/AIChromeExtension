<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Break Guard — Configuration</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 340px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      color: #f8fafc;
    }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .c-move { color: #34d399; }
    .c-drink { color: #38bdf8; }
    .c-lunch { color: #fb923c; }
    .c-night { color: #c084fc; }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 3px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 5px;
      color: #f8fafc;
      padding: 5px 7px;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-save {
      background: #16a34a;
      color: #ffffff;
    }
    .btn-save:hover {
      background: #15803d;
    }
    .btn-reset {
      background: #334155;
      color: #e2e8f0;
      flex: 0 0 auto;
    }
    .btn-reset:hover {
      background: #475569;
    }
    .status-msg {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      color: #4ade80;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Break Guard</span>
    <span class="badge">Alertes &amp; Horaires</span>
  </div>

  <div class="card">
    <div class="section-title c-move">🚶 Mouvement &amp; Hydratation</div>
    <div class="grid-3">
      <div>
        <label for="moveMinutes">Bouger (min)</label>
        <input id="moveMinutes" type="number" min="1" max="480" />
      </div>
      <div>
        <label for="drinkMinutes">Boire (min)</label>
        <input id="drinkMinutes" type="number" min="1" max="720" />
      </div>
      <div>
        <label for="idleResetMinutes">Inactivité (min)</label>
        <input id="idleResetMinutes" type="number" min="1" max="240" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title c-lunch">🍽️ Pause déjeuner</div>
    <div class="grid-3">
      <div>
        <label for="lunchStartHour">Début (h)</label>
        <input id="lunchStartHour" type="number" min="0" max="23" />
      </div>
      <div>
        <label for="lunchEndHour">Fin (h)</label>
        <input id="lunchEndHour" type="number" min="1" max="24" />
      </div>
      <div>
        <label for="lunchRepeatMinutes">Rappel (min)</label>
        <input id="lunchRepeatMinutes" type="number" min="1" max="180" />
      </div>
    </div>
  </div>
  <div class="card">
    <div class="section-title c-night">🌙 Coucher &amp; Répétition nuit</div>
    <div class="grid-3" style="margin-bottom: 8px;">
      <div>
        <label for="nightStartHour">Début nuit (h)</label>
        <input id="nightStartHour" type="number" min="0" max="23" />
      </div>
      <div>
        <label for="nightEndHour">Fin nuit (h)</label>
        <input id="nightEndHour" type="number" min="0" max="12" />
      </div>
      <div>
        <label for="nightEndMinute">Fin nuit (min)</label>
        <input id="nightEndMinute" type="number" min="0" max="59" />
      </div>
    </div>
    <div class="grid-3">
      <div>
        <label for="nightRepeat0h">Rappel 0h (min)</label>
        <input id="nightRepeat0h" type="number" min="1" max="120" />
      </div>
      <div>
        <label for="nightRepeat1h">Rappel 1h (min)</label>
        <input id="nightRepeat1h" type="number" min="1" max="120" />
      </div>
      <div>
        <label for="nightRepeat2h">Rappel ≥2h (min)</label>
        <input id="nightRepeat2h" type="number" min="1" max="120" />
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="saveBtn" class="btn-save" type="button">Enregistrer</button>
    <button id="resetPosBtn" class="btn-reset" type="button" title="Replacer les cartes à leur position initiale">Positions</button>
    <button id="resetBtn" class="btn-reset" type="button">Défaut</button>
  </div>
  <div id="statusMsg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
