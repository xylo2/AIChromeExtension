<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Break Guard — Configuration</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 372px;
      margin: 0;
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .title { font-weight: 700; font-size: 15px; color: #f8fafc; }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
    }
    .card { background: #1e293b; border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
    .dnd-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .dnd-status { font-size: 11px; font-weight: 600; color: #e2e8f0; }
    .dnd-btns { display: flex; gap: 5px; }
    .btn-dnd { background: #334155; color: #f8fafc; padding: 4px 8px; font-size: 11px; flex: 0 0 auto; }
    .btn-dnd:hover { background: #475569; }
    .btn-dnd-stop { background: #dc2626; color: #ffffff; padding: 4px 8px; font-size: 11px; flex: 0 0 auto; }
    .section-title { font-size: 12px; font-weight: 700; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
    .section-desc { font-size: 11px; line-height: 1.3; color: #cbd5e1; margin: 0 0 7px 0; }
    .toggle-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
    .toggle-lbl { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #e2e8f0; cursor: pointer; margin: 0; }
    .toggle-lbl input[type="checkbox"] { width: auto; margin: 0; accent-color: #38bdf8; }
    .c-move { color: #34d399; }
    .c-eyes { color: #2dd4bf; }
    .c-lunch { color: #fb923c; }
    .c-night { color: #c084fc; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 5px;
      color: #f8fafc;
      padding: 4px 6px;
      font-size: 12px;
    }
    input[type="number"]:focus { outline: none; border-color: #38bdf8; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; border: none; border-radius: 6px; padding: 7px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-save { background: #16a34a; color: #ffffff; }
    .btn-save:hover { background: #15803d; }
    .btn-reset { background: #334155; color: #e2e8f0; flex: 0 0 auto; }
    .btn-reset:hover { background: #475569; }
    .status-msg { margin-top: 6px; font-size: 12px; font-weight: 600; text-align: center; color: #4ade80; min-height: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Break Guard</span>
    <span class="badge">Alertes &amp; Horaires</span>
  </div>

  <div class="card">
    <div class="dnd-bar">
      <span id="dndStatus" class="dnd-status">🔕 Mode réunion : inactif</span>
      <div class="dnd-btns">
        <button id="dnd1hBtn" class="btn-dnd" type="button">Pause 1 h</button>
        <button id="dnd2hBtn" class="btn-dnd" type="button">2 h</button>
        <button id="dndOffBtn" class="btn-dnd-stop" type="button" style="display:none;">Reprendre</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title c-move">🚶 Mouvement &amp; Hydratation</div>
    <div class="toggle-row">
      <label class="toggle-lbl"><input id="enableMove" type="checkbox" /> Bouger</label>
      <label class="toggle-lbl"><input id="enableDrink" type="checkbox" /> Boire</label>
    </div>
    <div class="grid-3">
      <div>
        <label for="moveMinutes">Bouger (min)</label>
        <input id="moveMinutes" type="number" min="1" max="480" />
      </div>
      <div>
        <label for="drinkMinutes">Boire (min)</label>
        <input id="drinkMinutes" type="number" min="1" max="720" />
      </div>
      <div>
        <label for="idleResetMinutes">Inactivité (min)</label>
        <input id="idleResetMinutes" type="number" min="1" max="240" />
      </div>
    </div>
  </div>
  <div class="card">
    <div class="section-title c-eyes">👀 Pause visuelle (20-20-20) &amp; Posture</div>
    <div class="toggle-row">
      <label class="toggle-lbl"><input id="enableEyes" type="checkbox" /> Yeux 20-20-20</label>
      <label class="toggle-lbl"><input id="enablePosture" type="checkbox" /> Posture dos</label>
    </div>
    <div class="grid-2">
      <div>
        <label for="eyesMinutes">Yeux 20-20-20 (min)</label>
        <input id="eyesMinutes" type="number" min="1" max="240" />
      </div>
      <div>
        <label for="postureMinutes">Posture dos (min)</label>
        <input id="postureMinutes" type="number" min="1" max="480" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title c-lunch">🍽️ Repas (Déjeuner &amp; Dîner)</div>
    <div class="toggle-row">
      <label class="toggle-lbl"><input id="enableLunch" type="checkbox" /> Déjeuner</label>
      <label class="toggle-lbl"><input id="enableDinner" type="checkbox" /> Dîner</label>
    </div>
    <div class="grid-3" style="margin-bottom: 6px;">
      <div>
        <label for="lunchStartHour">Déj. début (h)</label>
        <input id="lunchStartHour" type="number" min="0" max="23" />
      </div>
      <div>
        <label for="lunchEndHour">Déj. fin (h)</label>
        <input id="lunchEndHour" type="number" min="1" max="24" />
      </div>
      <div>
        <label for="lunchRepeatMinutes">Rappel déj. (min)</label>
        <input id="lunchRepeatMinutes" type="number" min="1" max="180" />
      </div>
    </div>
    <div class="grid-3">
      <div>
        <label for="dinnerStartHour">Dîner début (h)</label>
        <input id="dinnerStartHour" type="number" min="0" max="23" />
      </div>
      <div>
        <label for="dinnerEndHour">Dîner fin (h)</label>
        <input id="dinnerEndHour" type="number" min="1" max="24" />
      </div>
      <div>
        <label for="dinnerRepeatMinutes">Rappel dîner (min)</label>
        <input id="dinnerRepeatMinutes" type="number" min="1" max="180" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title c-night">🌇 Fin de journée &amp; Coucher</div>
    <div class="toggle-row">
      <label class="toggle-lbl"><input id="enableWindDown" type="checkbox" /> Fin de journée</label>
      <label class="toggle-lbl"><input id="enableNight" type="checkbox" /> Coucher (nuit)</label>
    </div>
    <div class="grid-2" style="margin-bottom: 6px;">
      <div>
        <label for="windDownHour">Fin journée (h)</label>
        <input id="windDownHour" type="number" min="0" max="23" />
      </div>
      <div>
        <label for="windDownMinute">Fin journée (min)</label>
        <input id="windDownMinute" type="number" min="0" max="59" />
      </div>
    </div>
    <div class="grid-3" style="margin-bottom: 6px;">
      <div>
        <label for="nightStartHour">Début nuit (h)</label>
        <input id="nightStartHour" type="number" min="0" max="23" />
      </div>
      <div>
        <label for="nightEndHour">Fin nuit (h)</label>
        <input id="nightEndHour" type="number" min="0" max="12" />
      </div>
      <div>
        <label for="nightEndMinute">Fin nuit (min)</label>
        <input id="nightEndMinute" type="number" min="0" max="59" />
      </div>
    </div>
    <div class="grid-3">
      <div>
        <label for="nightRepeat0h">Avant 1h (min)</label>
        <input id="nightRepeat0h" type="number" min="1" max="120" />
      </div>
      <div>
        <label for="nightRepeat1h">À 1h (min)</label>
        <input id="nightRepeat1h" type="number" min="1" max="120" />
      </div>
      <div>
        <label for="nightRepeat2h">Dès 2h (min)</label>
        <input id="nightRepeat2h" type="number" min="1" max="120" />
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="saveBtn" class="btn-save" type="button">Enregistrer</button>
    <button id="resetPosBtn" class="btn-reset" type="button" title="Replacer les cartes à leur position initiale">Positions</button>
    <button id="resetBtn" class="btn-reset" type="button" title="Rétablir les valeurs d'origine">Défaut</button>
  </div>
  <div id="statusMsg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
