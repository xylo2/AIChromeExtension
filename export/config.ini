[export]
; Modèle du nom généré dans le répertoire courant ({project_name} est remplacé automatiquement)
output_filename = {project_name}_export.txt

; Active ou désactive la prise en compte des fichiers .gitignore (true / false)
respect_gitignore = true

; Dossiers systématiquement ignorés (séparés par des virgules)
excluded_dirs = .venv, venv, env, __pycache__, .git, .idea, .vscode, build, dist, node_modules, .pytest_cache, .mypy_cache, .ruff_cache, htmlcov, lib, sdk, cache, .watch_clipboard, .native_host, ..

; Extensions de fichiers à inclure dans l'export (séparées par des virgules)
included_extensions = .py, .xml, .toml, .txt, .example, .md, .ini, .js, .html, .json, .css, .ps1

; Noms de fichiers exacts à inclure quelle que soit leur extension (séparés par des virgules)
included_exact_names =

; Motifs glob ou extensions à exclure systématiquement (séparés par des virgules)
excluded_patterns = dummy_spill_*.js

; Encodages de lecture (principal et repli)
primary_encoding = utf-8
fallback_encoding = latin-1
