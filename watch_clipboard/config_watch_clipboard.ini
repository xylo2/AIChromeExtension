[watcher]
# Intervalle en secondes entre deux vérifications du presse-papiers
poll_interval = 0.15

# Vide automatiquement le presse-papiers au démarrage s'il contient déjà une balise FILE
clear_on_startup = true

# Arrête automatiquement watch_clipboard lorsque le navigateur qui l'a lancé est fermé
auto_exit_on_browser_close = true

[assembler]
# Nombre maximal de parties autorisées pour un même fichier découpé
max_parts = 50

# Encodage utilisé pour la lecture des fragments et l'écriture des fichiers cibles
encoding = utf-8

# Nom du répertoire miroir conservant les fragments .partN pour régénération partielle
temp_dir_name = .watch_clipboard

# Étiquettes de langage Markdown à nettoyer en première ligne d'un bloc
strip_lang_tags = toml, text, python, json, javascript, css, html, ini

[server]
# Active le micro-serveur HTTP local permettant à l'extension Chrome de vérifier l'état
enabled = true

# Adresse d'écoute locale (ne pas exposer sur 0.0.0.0 par sécurité)
host = 127.0.0.1

# Port HTTP local interrogé par l'extension Chrome
port = 18765

# Chemin relatif (depuis le dossier cible) ou absolu du lanceur de tests
test_runner_path = tools/run_tests_clip.py
